<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JobTinder</title>

  <!-- iOS Vollbild / Theme -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0f172a">

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Top Job finden – JobSwipe</title>
<style>
  :root{
    --accent:#8D0000;
    --bg:#eceef2;
    --surface:#ffffff;
    --card:#f8f8f8;
    --text:#1b1b1b;
    --muted:#666;
    --yes:#2ecc71;
    --no:#ff5c7a;
    --shadow:0 20px 60px rgba(0,0,0,.15);
    --soft:0 10px 30px rgba(0,0,0,.08);
    --device-w:420px;
    --device-h:760px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 700px at 20% -10%,#fff 0,#e9eaee 60%,#dde0e6 100%),var(--bg);
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    display:flex;align-items:center;justify-content:center;padding:24px;color:var(--text);
  }

  /* Phone frame */
  .device{
    width:min(var(--device-w),100%);
    height:min(var(--device-h),calc(100vh - 48px));
    background:var(--surface);
    border-radius:28px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.06);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .safe{display:flex;flex-direction:column;height:100%;background:var(--surface)}

  /* Top App Bar */
  .topbar{
    height:68px;flex:0 0 auto;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;
    border-bottom:1px solid rgba(0,0,0,.06);background:#fff;
  }
  .topbar__btn{width:56px;height:68px;display:grid;place-items:center;cursor:pointer;border:0;background:transparent}
  .icon{width:24px;height:24px;display:block;color:var(--text)}
  .topbar__title{
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  }
  .topbar__title b{color:var(--accent);font-weight:800;font-size:18px;letter-spacing:.2px}
  .topbar__title small{margin-top:4px;color:#9aa1ad;font-weight:700;font-size:12px;letter-spacing:.3px}

  /* Content */
  .content{
    flex:1 1 auto;display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:14px 16px 10px;background:linear-gradient(180deg,#fff 0%,#fff 60%,#fafbfc 100%);
  }

  .deck{position:relative;width:100%;max-width:360px;flex:1 1 auto;border-radius:20px;aspect-ratio:3/4;perspective:1200px}
  .card{
    position:absolute;inset:0;background:var(--card);border-radius:20px;overflow:hidden;
    box-shadow:var(--soft);display:grid;grid-template-rows:1fr auto;
    transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .45s ease,background .25s ease;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .25s ease, box-shadow .25s ease}
  .meta{padding:14px 16px;background:#fff}
  .title{margin:0 0 4px;font-weight:800;font-size:18px;color:var(--accent)}
  .subtitle{margin:0;font-size:13px;color:var(--muted)}

  .controls{display:flex;gap:18px;margin-top:6px}
  .btn{
    width:68px;height:68px;border-radius:999px;border:none;cursor:pointer;display:grid;place-items:center;
    background:#f3f4f6;color:#333;box-shadow:0 4px 14px rgba(0,0,0,.12);
    transition:transform .08s ease,box-shadow .2s ease,background .2s ease;
  }
  .btn:active{transform:scale(.95)}
  .btn.like{color:var(--yes)}
  .btn.nope{color:var(--no)}

  .dots{display:flex;gap:8px;margin-top:6px}
  .dot{width:8px;height:8px;border-radius:999px;background:#d7d9de;transition:all .25s ease}
  .dot.active{width:22px;background:var(--accent)}

  .empty{
    width:100%;max-width:360px;aspect-ratio:3/4;border:1px dashed #d6d6d6;border-radius:20px;
    display:none;place-items:center;text-align:center;color:#777;padding:18px;background:#fff;
  }
  .empty h2{margin:0 0 8px;color:var(--accent)}

  /* Flash + swipe */
  .img-like-glow{ filter: saturate(1.15) brightness(1.08) drop-shadow(0 0 0 rgba(0,0,0,0)); box-shadow: inset 0 0 0 9999px rgba(46,204,113,.20) }
  .swipe-right{transform:translateX(120%) rotate(12deg);opacity:0}
  .swipe-left{ transform:translateX(-120%) rotate(-12deg);opacity:0}
  .next-prepare{transform:scale(.94) translateY(6px);opacity:.7}

  /* Bottom Nav */
  .bottombar{
    height:70px;flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;align-items:stretch;
    border-top:1px solid rgba(0,0,0,.06);background:#fff;
  }
  .nav-btn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#7a7f88}
  .nav-btn.active{color:var(--accent)}
  .nav-btn span{font-size:12px;font-weight:700}
  .nav-btn .icon{width:22px;height:22px}

  /* MATCH OVERLAY */
  .overlay{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(0,0,0,.6);z-index:30;
  }
  .overlay.open{display:flex}
  .match-card{
    max-width:92vw;width:min(380px,92vw);background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .16s ease-out;
  }
  @keyframes pop{from{transform:scale(.92);opacity:.6}to{transform:scale(1);opacity:1}}
  .match-img-wrap{position:relative}
  .match-img{width:100%;height:320px;object-fit:cover;display:block;box-shadow: inset 0 0 0 9999px rgba(46,204,113,.18)}
  .match-badge{
    position:absolute;top:10px;left:10px;background:#16a34a;color:#fff;font-weight:800;
    padding:8px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);letter-spacing:.4px
  }
  .match-meta{padding:14px 16px}
  .match-title{margin:0 0 2px;font-size:18px;font-weight:800;color:var(--accent)}
  .match-sub{margin:0;color:#666;font-size:13px}
  .overlay .close{
    position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);border:none;border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer
  }
</style>
</head>
<body>
  <!-- Match Overlay -->
  <div class="overlay" id="overlay" aria-modal="true" role="dialog">
    <button class="close" id="overlayClose" aria-label="Schließen">
      <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="match-card" id="matchCard">
      <div class="match-img-wrap">
        <img id="matchImg" class="match-img" alt="Match Bild">
        <div class="match-badge">MATCH</div>
      </div>
      <div class="match-meta">
        <h3 id="matchTitle" class="match-title">Jobtitel</h3>
        <p id="matchSub" class="match-sub">Details</p>
      </div>
    </div>
  </div>

  <div class="device" role="region" aria-label="JobSwipe Gerät">
    <div class="safe">
      <!-- TOP APP BAR -->
      <header class="topbar">
        <button class="topbar__btn" id="homeTop" aria-label="Home">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path d="M3 10.5l9-7 9 7V20a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2v-9.5z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="topbar__title">
          <b>Top Job finden</b>
          <small>07985 Elsterberg</small>
        </div>
        <button class="topbar__btn" id="inboxTop" aria-label="Nachrichten">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path d="M21 10a7 7 0 0 1-7 7H9l-6 4V7a5 5 0 0 1 5-5h6a7 7 0 0 1 7 8z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <!-- CONTENT -->
      <main class="content">
        <div class="deck" id="deck" aria-live="polite"></div>

        <div class="empty" id="empty">
          <div>
            <h2>Alle Jobs durchgeswiped 🎉</h2>
            <p>Starte neu oder wähle unten Home/Chat.</p>
            <button id="reset" class="btn">Neu starten</button>
          </div>
        </div>

        <div class="controls" aria-label="Aktionen">
          <button class="btn nope" id="nope" aria-label="Nein">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="btn like" id="like" aria-label="Ja">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 7.5c0-2-1.7-3.5-3.6-3.5-1.4 0-2.6.8-3.4 2-.8-1.2-2-2-3.4-2C6.7 4 5 5.5 5 7.5c0 5.2 6 9 8 10 2-1 8-4.8 8-10z" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </button>
        </div>

        <div class="dots" id="dots" aria-hidden="true"></div>
      </main>

      <!-- BOTTOM NAV -->
      <nav class="bottombar" aria-label="Navigation">
        <button class="nav-btn active" id="homeBottom" aria-label="Home">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path d="M3 10.5l9-7 9 7V20a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2v-9.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Home</span>
        </button>
        <button class="nav-btn" id="chatBottom" aria-label="Nachrichten">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path d="M21 10a7 7 0 0 1-7 7H9l-6 4V7a5 5 0 0 1 5-5h6a7 7 0 0 1 7 8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Chat</span>
        </button>
      </nav>
    </div>
  </div>

<script>
  // Demo-Daten
  const jobs = [
    {
      title: "Grafikdesigner:in",
      img: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=1600&auto=format&fit=crop",
      subtitle: "Kreativagentur · Vollzeit"
    },
    {
      title: "Straßenbauer:in",
      img: "Strassenbau.png",
      subtitle: "SBN Vogtland · Fugenverguss & Risssanierung"
    },
    {
      title: "Personal Trainer:in",
      img: "https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=1600&auto=format&fit=crop",
      subtitle: "Fitnessstudio · Teilzeit/Vollzeit"
    }
  ];

  const deckEl = document.getElementById('deck');
  const dotsEl = document.getElementById('dots');
  const emptyEl = document.getElementById('empty');
  const likeBtn = document.getElementById('like');
  const nopeBtn = document.getElementById('nope');
  const resetBtn = document.getElementById('reset');

  // Overlay refs
  const overlay = document.getElementById('overlay');
  const overlayClose = document.getElementById('overlayClose');
  const matchImg = document.getElementById('matchImg');
  const matchTitle = document.getElementById('matchTitle');
  const matchSub = document.getElementById('matchSub');

  let index = 0, locked = false;

  function createCard(job, i){
    const card = document.createElement('article');
    card.className = 'card';
    card.setAttribute('role','group');
    card.setAttribute('aria-label', job.title);
    card.innerHTML = `
      <img src="${job.img}" alt="${job.title}">
      <div class="meta">
        <h2 class="title">${job.title}</h2>
        <p class="subtitle">${job.subtitle}</p>
      </div>`;
    return card;
  }

  function renderDots(){
    dotsEl.innerHTML = '';
    jobs.forEach((_, i)=>{
      const d = document.createElement('div');
      d.className = 'dot' + (i===index?' active':'');
      dotsEl.appendChild(d);
    });
  }

  function renderDeck(){
    deckEl.innerHTML = '';
    for(let i = jobs.length - 1; i >= index; i--){
      const c = createCard(jobs[i], i);
      if(i>index) c.classList.add('next-prepare');
      deckEl.appendChild(c);
    }
    const done = index>=jobs.length;
    emptyEl.style.display = done ? 'grid' : 'none';
    renderDots();
  }

  function openMatchOverlay(job){
    matchImg.src = job.img;
    matchImg.alt = job.title;
    matchTitle.textContent = job.title;
    matchSub.textContent = job.subtitle || '';
    overlay.classList.add('open');
  }
  function closeOverlay(){
    overlay.classList.remove('open');
  }
  overlay.addEventListener('click', (e)=> {
    if(e.target === overlay || e.target === overlayClose){ closeOverlay(); }
  });

  function swipe(direction){
    if(locked || index>=jobs.length) return;
    locked = true;
    const topCard = deckEl.querySelector('.card');
    const topImg = topCard.querySelector('img');
    const nextCard = deckEl.querySelectorAll('.card')[1];
    if(nextCard) nextCard.classList.remove('next-prepare');

    if(direction==='right'){
      // Flash das Bild grün & zeige Match-Overlay
      topImg.classList.add('img-like-glow');
      const currentJob = jobs[index];
      setTimeout(()=> {
        openMatchOverlay(currentJob);
      }, 140);

      // Nach kurzer Zeit automatisch weiter
      setTimeout(()=> {
        topImg.classList.remove('img-like-glow');
        topCard.classList.add('swipe-right');
        setTimeout(()=>{ index++; renderDeck(); locked=false; }, 460);
        // Overlay automatisch schließen etwas später
        setTimeout(()=> closeOverlay(), 3000);
      }, 550);

      return; // exit early, da wir oben schon timen
    }

    // Left swipe normal
    requestAnimationFrame(()=>{
      topCard.classList.add('swipe-left');
      setTimeout(()=>{ index++; renderDeck(); locked=false; }, 460);
    });
  }

  likeBtn.addEventListener('click', ()=>swipe('right'));
  nopeBtn.addEventListener('click', ()=>swipe('left'));

  // Keyboard support
  window.addEventListener('keydown', e=>{
    if(index >= jobs.length) return;
    if(e.key === 'ArrowRight') swipe('right');
    if(e.key === 'ArrowLeft')  swipe('left');
  });

  if(resetBtn){ resetBtn.addEventListener('click', ()=>{ index = 0; renderDeck(); }); }

  // Faux navigation toggles (Demo)
  const homeTop = document.getElementById('homeTop');
  const inboxTop = document.getElementById('inboxTop');
  const homeBottom = document.getElementById('homeBottom');
  const chatBottom = document.getElementById('chatBottom');
  function setActiveNav(which){
    homeBottom.classList.toggle('active', which==='home');
    chatBottom.classList.toggle('active', which==='chat');
  }
  homeTop?.addEventListener('click', ()=>setActiveNav('home'));
  homeBottom?.addEventListener('click', ()=>setActiveNav('home'));
  inboxTop?.addEventListener('click', ()=>setActiveNav('chat'));
  chatBottom?.addEventListener('click', ()=>setActiveNav('chat'));

  // Initial render
  renderDeck();
</script>
</body>
</html>
